name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and log tool versions
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          swift --version
          swift format --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint Swift formatting
        run: swift format lint --strict -r Sources Tests
