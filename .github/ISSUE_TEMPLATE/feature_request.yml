name: Feature request
description: Suggest an idea or improvement for Lighten.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation on your Mac that Lighten does not handle well today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Lighten to do?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safety
      description: |
        For new cleanup suggestions, link documentation that describes the location, and explain how Lighten
        could tell that the data is safe to remove.
